# Only ESO may create or change Secrets in the app namespace, so every secret
# there has to come from Secrets Manager. Checks the requesting user, so it
# only applies at admission; audit has no user info and skips it.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8ssecretsfromallowedusers
spec:
  crd:
    spec:
      names:
        kind: K8sSecretsFromAllowedUsers
      validation:
        openAPIV3Schema:
          type: object
          properties:
            allowedUsers:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8ssecretsfromallowedusers

        violation[{"msg": msg}] {
          user := input.review.userInfo.username
          not allowed(user)
          msg := sprintf("<%v> may not create or modify Secret <%v>; secrets here are managed by External Secrets Operator only", [user, input.review.object.metadata.name])
        }

        allowed(user) {
          user == input.parameters.allowedUsers[_]
        }

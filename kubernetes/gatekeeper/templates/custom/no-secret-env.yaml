# Secrets must be mounted as files, never passed as env vars.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8snosecretenv
spec:
  crd:
    spec:
      names:
        kind: K8sNoSecretEnv
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8snosecretenv

        containers[c] { c := input.review.object.spec.containers[_] }
        containers[c] { c := input.review.object.spec.initContainers[_] }
        containers[c] { c := input.review.object.spec.ephemeralContainers[_] }

        violation[{"msg": msg}] {
          c := containers[_]
          e := c.env[_]
          e.valueFrom.secretKeyRef
          msg := sprintf("container <%v> reads Secret <%v> into env var <%v>, mount it as a volume instead", [c.name, e.valueFrom.secretKeyRef.name, e.name])
        }

        violation[{"msg": msg}] {
          c := containers[_]
          ef := c.envFrom[_]
          ef.secretRef
          msg := sprintf("container <%v> loads Secret <%v> with envFrom, mount it as a volume instead", [c.name, ef.secretRef.name])
        }

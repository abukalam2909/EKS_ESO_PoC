# secret-reader carries the AWS role and is only for the SecretStore.
# No pod may run as it.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowedserviceaccounts
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowedServiceAccounts
      validation:
        openAPIV3Schema:
          type: object
          properties:
            names:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowedserviceaccounts

        violation[{"msg": msg}] {
          spec := input.review.object.spec
          sa := object.get(spec, "serviceAccountName", object.get(spec, "serviceAccount", "default"))
          sa == input.parameters.names[_]
          msg := sprintf("pods may not run as service account <%v>", [sa])
        }

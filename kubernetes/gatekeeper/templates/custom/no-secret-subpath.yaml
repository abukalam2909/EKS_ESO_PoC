# subPath mounts of a secret never get updated by the kubelet, so rotation
# would silently never reach the pod.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8snosecretsubpath
spec:
  crd:
    spec:
      names:
        kind: K8sNoSecretSubPath
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8snosecretsubpath

        containers[c] { c := input.review.object.spec.containers[_] }
        containers[c] { c := input.review.object.spec.initContainers[_] }
        containers[c] { c := input.review.object.spec.ephemeralContainers[_] }

        secret_volumes[v.name] {
          v := input.review.object.spec.volumes[_]
          v.secret
        }

        secret_volumes[v.name] {
          v := input.review.object.spec.volumes[_]
          v.projected.sources[_].secret
        }

        violation[{"msg": msg}] {
          c := containers[_]
          m := c.volumeMounts[_]
          secret_volumes[m.name]
          sub := concat("", [object.get(m, "subPath", ""), object.get(m, "subPathExpr", "")])
          sub != ""
          msg := sprintf("container <%v> mounts secret volume <%v> with subPath, which never receives rotated values", [c.name, m.name])
        }

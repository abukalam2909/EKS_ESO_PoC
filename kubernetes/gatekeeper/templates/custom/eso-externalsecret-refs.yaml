# ExternalSecrets may only pull from a namespaced SecretStore - no
# ClusterSecretStore and no generators.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: esoexternalsecretrefs
spec:
  crd:
    spec:
      names:
        kind: EsoExternalSecretRefs
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package esoexternalsecretrefs

        spec := input.review.object.spec
        name := input.review.object.metadata.name

        entries[e] { e := spec.data[_] }
        entries[e] { e := spec.dataFrom[_] }

        violation[{"msg": msg}] {
          kind := object.get(object.get(spec, "secretStoreRef", {}), "kind", "SecretStore")
          kind != "SecretStore"
          msg := sprintf("ExternalSecret <%v> references a %v, only SecretStore is allowed", [name, kind])
        }

        violation[{"msg": msg}] {
          e := entries[_]
          kind := object.get(e.sourceRef.storeRef, "kind", "SecretStore")
          kind != "SecretStore"
          msg := sprintf("ExternalSecret <%v> references a %v in sourceRef, only SecretStore is allowed", [name, kind])
        }

        violation[{"msg": msg}] {
          e := entries[_]
          e.sourceRef.generatorRef
          msg := sprintf("ExternalSecret <%v> uses a generator, which is not allowed", [name])
        }

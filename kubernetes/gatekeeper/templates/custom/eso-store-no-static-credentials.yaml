# Static access keys in a k8s Secret are long-lived and work from anywhere.
# Stores have to use a service account token (IRSA) instead.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: esostorenostaticcredentials
spec:
  crd:
    spec:
      names:
        kind: EsoStoreNoStaticCredentials
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package esostorenostaticcredentials

        violation[{"msg": msg}] {
          auth := input.review.object.spec.provider[p].auth
          auth.secretRef
          msg := sprintf("SecretStore <%v> uses static credentials (provider.%v.auth.secretRef), use auth.jwt.serviceAccountRef", [input.review.object.metadata.name, p])
        }

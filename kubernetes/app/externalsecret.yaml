apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-api-key
  namespace: demo-app
spec:
  # 1h: rotation happens every 30 days so faster polling buys little and
  # just adds GetSecretValue calls. force a sync with the annotation in
  # DEPLOY.md when testing rotation.
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: app-api-key
    # ESO owns the k8s secret: it won't adopt an existing secret with the same
    # name, and the secret is cleaned up when the ExternalSecret is deleted
    creationPolicy: Owner
    # if the AWS secret disappears or is unreadable, keep the last good copy
    # instead of deleting it and breaking the app. revoke by rotating.
    deletionPolicy: Retain
  data:
    - secretKey: api-key
      remoteRef:
        key: demo/app/api-key

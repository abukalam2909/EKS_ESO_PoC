# secret-reader: carries the IRSA role, runs no pods (Gatekeeper enforces
# that). Only the SecretStore uses it, via a token ESO requests.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-reader
  namespace: demo-app
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/demo-app-secret-reader
automountServiceAccountToken: false
---
# app: what the workload runs as. No role annotation, so the pod never gets
# AWS credentials - it only reads the mounted file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: demo-app
automountServiceAccountToken: false
